<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../odin-calculator/calculator.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="calculator">
      <input id="output" type="text" disabled />
      <div class="number_buttons">
        <button id="btnClear">C</button>
        <button class="btnOperator" id="btnDivide">/</button>
        <button class="btnOperator" id="btnMultiply">x</button>
        <button class="btnOperator" id="btnMinus">-</button>
        <button class="btnOperator" id="btnAdd">+</button>
        <button class="btn" id="btnDot">.</button>
        <button class="btn" id="btn7">-</button>
        <button class="btn" id="btn7">7</button>
        <button class="btn" id="btn8">8</button>
        <button class="btn" id="btn9">9</button>

        <button class="btn" id="btn4">4</button>
        <button class="btn" id="btn5">5</button>
        <button class="btn" id="btn6">6</button>

        <button class="btn" id="btn1">1</button>
        <button class="btn" id="btn2">2</button>
        <button class="btn" id="btn3">3</button>
        <button class="btn" id="btn0">0</button>
        <button id="btnEqual">=</button>
      </div>
    </div>

    <script src="calculator.js"></script>
  </body>
</html>
